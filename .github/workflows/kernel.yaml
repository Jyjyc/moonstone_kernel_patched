name: Build Android Kernel (moonstone)

on:
  workflow_dispatch:
  push:
    branches: [ jyjyc-mods, jyjyc-mods-test-1, mods-asdf ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Maximize Build Space
      if: false
      uses: AdityaGarg8/remove-unwanted-software@v5
      with:
        remove-dotnet: 'true'          # Frees ~2 GB
        remove-android: 'true'         # Frees ~9 GB
        remove-haskell: 'true'         # Frees ~5.2 GB
        remove-codeql: 'true'          # Frees ~5.4 GB
        remove-docker-images: 'true'   # Frees ~3.2 GB
        remove-large-packages: 'true'  # Frees ~3.1 GB
        remove-swapfile: 'false'        # Frees ~4 GB
        remove-cached-tools: 'false'   # Avoid unless confirmed safe
        verbose: 'false'                # Enable detailed logging
 
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        #clang triplet
        echo "CROSS_COMPILE=aarch64-none-linux-gnu-" >> $GITHUB_ENV
        #gcc triplet
        #echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=ccache clang" >> $GITHUB_ENV
        echo "CXX=ccache clang++" >> $GITHUB_ENV
        #echo "CC=clang" >> $GITHUB_ENV
        #echo "CXX=clang++" >> $GITHUB_ENV
        echo "CPP=clang-cpp" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        #echo "LD=ld.mold" >> $GITHUB_ENV
        echo "STRIP=llvm-strip" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
        echo "RANLIB=llvm-ranlib" >> $GITHUB_ENV
        echo "READELF=llvm-readelf" >> $GITHUB_ENV
        echo "HOSTCC=ccache clang" >> $GITHUB_ENV
        echo "HOSTCXX=ccache clang++" >> $GITHUB_ENV
        #echo "HOSTCC=clang" >> $GITHUB_ENV
        #echo "HOSTCXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS=\"-O3 -flto=thin\"" >> $GITHUB_ENV
        #echo "CFLAGS=\"-O3\"" >> $GITHUB_ENV
        echo "CXXFLAGS=\"-O3 -flto=thin\"" >> $GITHUB_ENV
        #echo "CXXFLAGS=\"-O3\"" >> $GITHUB_ENV
        #echo "LDFLAGS=-flto=thin -fuse-ld=lld" >> $GITHUB_ENV
        #echo "LDFLAGS=-fuse-ld=lld" >> $GITHUB_ENV
        echo "LDFLAGS=\"-flto=thin\"" >> $GITHUB_ENV
        #echo "LDFLAGS=-fuse-ld=gold" >> $GITHUB_ENV
        echo "LTO=thin" >> $GITHUB_ENV
        #echo "LTO=off" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=github" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=actions" >> $GITHUB_ENV
        echo "LLVM_ENABLE_PROJECTS=clang;polly;lld" >> $GITHUB_ENV
        #echo "LLVM_ENABLE_PROJECTS=clang;lld" >> $GITHUB_ENV
        #echo "LLVM_ENABLE_PROJECTS=clang" >> $GITHUB_ENV
        echo "WITH_POLLY=on" >> $GITHUB_ENV
        #echo "WITH_POLLY=off" >> $GITHUB_ENV
        echo "LLVM_USE_LINKER=lld" >> $GITHUB_ENV
        echo "LLVM_ENABLE_LLD=on" >> $GITHUB_ENV
        #echo "LLVM_ENABLE_LLD=off" >> $GITHUB_ENV
        echo "LLVM_HOST_TRIPLE=aarch64-linux-gnu" >> $GITHUB_ENV
        echo "LLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-gnu" >> $GITHUB_ENV
        echo "LLVM_TARGETS_TO_BUILD=aarch64" >> $GITHUB_ENV
        echo "MYBRANCH=$(git branch --show-current)" >> $GITHUB_ENV
        echo "CCACHE_DIR="$HOME/.ccache" >> $GITHUB_ENV
        mkdir -v -p rejects
        mkdir -v -p logs
        cd logs
        echo "LOGS_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Install deps
      #if: false
      run: |
        sudo apt update > /dev/null 2>&1
        sudo apt remove -y firefox > /dev/null 2>&1
        echo "Apt update and Firefox uninstall completed"
        sudo apt-mark hold linux-* > /dev/null 2>&1
        echo "Apt hold successful"
        sudo apt upgrade -y > /dev/null 2>&1
        echo "Upgrade completed"
        sudo apt install -y bc bison flex libssl-dev build-essential \
        libncurses5-dev libncursesw5-dev python3 zstd repo git \
        git-lfs device-tree-compiler lz4 xz-utils fontconfig lib32z1-dev \
        zlib1g-dev python-is-python3 p7zip-full android-sdk-libsparse-utils \
        erofs-utils default-jdk gnupg gperf zip curl libncurses-dev libx11-dev \
        libreadline-dev libgl1 libgl1-mesa-dev make sudo bc grep tofrodos \
        python3-markdown libxml2-utils xsltproc libc6-dev libtinfo6 cpio kmod \
        openssl libelf-dev pahole libarchive-tools rsync ssh git-core \
        x11proto-core-dev unzip \
        --fix-missing
        sudo apt install -y lld clang-tools llvm-dev --fix-missing
        #sudo apt install -y binutils-gold --fix-missing
        sudo apt install -y mold --fix-missing
        #sudo apt install -y gcc-aarch64-linux-gnu --fix-missing
        echo "Apt packages install completed"

    - name: Configure ccache
      #if: false
      run: |
        sudo apt install -y ccache build-essential curl git repo zip make sudo grep unzip lld clang-tools llvm-dev mold --fix-missing
        mkdir -v -p $CCACHE_DIR
        touch $CCACHE_DIR/ccache.conf
        echo "ccache.conf"
        cat $CCACHE_DIR/ccache.conf
        cp -v $CCACHE_DIR/ccache.conf $LOGS_DIR/ccache_first.conf
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        echo "PATH=$PATH" >> $GITHUB_ENV
        echo "base_dir = $HOME/work/moonstone_kernel_patched/moonstone_kernel_patched" >> $CCACHE_DIR/ccache.conf
        echo "max_size = 8G" >> $CCACHE_DIR/ccache.conf
        echo "compression = true" >> $CCACHE_DIR/ccache.conf
        echo "compression_level = 3" >> $CCACHE_DIR/ccache.conf
        #echo "compression_level = 5" >> $CCACHE_DIR/ccache.conf
        echo "absolute_paths_in_stderr = true" >> $CCACHE_DIR/ccache.conf
        echo "cache_dir = $CCACHE_DIR" >> $CCACHE_DIR/ccache.conf
        echo "compiler_check = content" >> $CCACHE_DIR/ccache.conf
        echo "hash_dir = false" >> $CCACHE_DIR/ccache.conf
        echo "hard_link = false" >> $CCACHE_DIR/ccache.conf
        echo "file_clone = false" >> $CCACHE_DIR/ccache.conf
        echo "inode_cache = false" >> $CCACHE_DIR/ccache.conf
        echo "umask = 002" >> $CCACHE_DIR/ccache.conf
        echo "log_file = /var/log/ccache" >> $CCACHE_DIR/ccache.conf
        #echo "sloppiness = file_stat_matches,include_file_mtime,include_file_ctime,time_macros,clang_index_store,gcno_cwd" >> $CCACHE_DIR/ccache.conf
        echo "sloppiness = file_stat_matches,time_macros,clang_index_store,gcno_cwd,locale,random_seed" >> $CCACHE_DIR/ccache.conf
        cp -v $CCACHE_DIR/ccache.conf $LOGS_DIR/ccache.conf

    - name: Cache restore
      #if: false
      uses: actions/cache/restore@v5
      with:
        path: $CCACHE_DIR
        #key: ccache-${{ runner.os }}-${{ github.run_id }}
        key: ccache-${{ runner.os }}
        restore-keys: |
          ccache-${{ runner.os }}
          ccache-
        enableCrossOsArchive: true

    - name: Patch
      continue-on-error: true
      run: |
        KERNEL_ROOT=$(pwd)
        KERNEL_REPO=$KERNEL_ROOT
        echo "KERNEL_ROOT: $KERNEL_ROOT"
        #echo "Setup SukiSU"
        #curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        echo "Custom SukiSU"
        curl -LSs "https://raw.githubusercontent.com/Jyjyc/SukiSU-Ultra/builtin-jyc/kernel/setup.sh" | bash -s builtin-jyc
        #echo "Setup RKSU"
        #curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s susfs-rksu-master
        echo "Get susfs"
        #git clone --branch kernel-5.4-jyc-test-1 --single-branch https://github.com/Jyjyc/susfs4ksu.git susfs
        git clone --branch gki-android12-5.10 --single-branch https://gitlab.com/simonpunk/susfs4ksu.git susfs
        #git clone --branch kernel-5.4 --single-branch https://gitlab.com/simonpunk/susfs4ksu.git susfs
        echo "Copy susfs sources"
        cd susfs/kernel_patches
        cp -v ./fs/* $KERNEL_ROOT/fs/
        cp -v ./include/linux/* $KERNEL_ROOT/include/linux/
        #echo "Copy susfs patches"
        #cat ./KernelSU/10_enable_susfs_for_ksu/10_enable_susfs_for_ksu_00*.patch > $KERNEL_ROOT/KernelSU/10_enable_susfs_for_ksu.patch
        #cat ./50_add_susfs_in_kernel-5.4/50_add_susfs_in_kernel-5.4_00*.patch > $KERNEL_ROOT/50_add_susfs_in_kernel.patch
        #cp -v ./KernelSU/10_enable_susfs_for_ksu.patch $KERNEL_ROOT/KernelSU/10_enable_susfs_for_ksu.patch
        #cp -v ./50_add_susfs_in_gki-android12-5.10.patch $KERNEL_ROOT/50_add_susfs_in_kernel.patch
        #cp -v ./50_add_susfs_in_kernel-5.4.patch $KERNEL_ROOT/50_add_susfs_in_kernel.patch
        #echo "Get TWA_RESUME patch"
        #cd $KERNEL_ROOT/KernelSU
        #curl -LSs -o twa_resume.patch "https://raw.githubusercontent.com/Jyjyc/workspace-files/refs/heads/main/twa_resume.patch"
        #curl -LSs -o twa_resume.patch "https://raw.githubusercontent.com/Jyjyc/workspace-files/refs/heads/main/twa_resume_mod.patch"
        #echo "Apply TWA_RESUME patch"
        #patch -p1 < twa_resume.patch
        #echo "Apply susfs patches"
        #cd $KERNEL_ROOT/KernelSU
        #patch -p1 < 10_enable_susfs_for_ksu.patch
        #cd $KERNEL_ROOT
        #patch -p1 < 50_add_susfs_in_kernel.patch
        #echo "Apply custom patches"
        #cat ./patch/*.patch > custom.patch
        #patch -p1 < custom.patch

    - name: Defconfig
      run: |
        make -j$(nproc) O=out stone_defconfig

    - name: Apply local config tweaks (optional)
      run: |
        #./scripts/config --file out/.config \
          #--enable CONFIG_KPROBES \
          #--enable CONFIG_KRETPROBES
        #./scripts/config --file out/.config \
          #--enable CONFIG_KALLSYMS_ALL
        #./scripts/config --file out/.config \
          #--enable CONFIG_SUSFS4KSU
        #sort -u out/.config --output=out/.config
        make -j$(nproc) O=out olddefconfig
  
    - name: Collect .rej files
      if: always()
      continue-on-error: true
      run: |
        #find . -name "*.rej" | zip -@ rejects/rejects.zip
        find . -name "*.rej" -exec cp -v "{}" rejects  \;

    - name: Upload patch rejects
      if: always()
      #continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: patch-rejects
        if-no-files-found: ignore
        path: rejects/

    - name: Build kernel
      if: false
      run: |
        make -j$(nproc) O=out

    - name: Tweak ccache
      run: |
        find $CCACHE_DIR -type d | xargs chmod g+s

    - name: Print debug infos
      run: |
        echo "CCACHE_DIR=$CCACHE_DIR"
        echo "ccache.conf"
        cat $CCACHE_DIR/ccache.conf
        echo "ccache.conf"
        ccache --show-config
        ccache --show-config >> $LOGS_DIR/ccache_config

    - name: Cache save
      #if: false
      uses: actions/cache/save@v5
      with:
        path: $CCACHE_DIR
        #key: ccache-${{ runner.os }}-${{ github.run_id }}
        key: ccache-${{ runner.os }}
        #restore-keys: |
          #ccache-${{ runner.os }}
          #ccache-
        enableCrossOsArchive: true

    - name: Upload some logs
      #if: always()
      #continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: logs
        if-no-files-found: warn
        path: |
          /var/log/ccache
          /var/log/ccache.conf
          /var/log/ccache_first.conf
          /var/log/ccache_config

    - name: Archive build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: kernel-out
        if-no-files-found: error
        path: |
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dts/**/*.dtb
          out/arch/arm64/boot/dtbo.img
